[project]
name = "jev-triage-api"
version = "0.1.0"
description = "FastAPI backend for the Jev triage board"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128",
    "sqlmodel>=0.0.24",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "respx>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "PTH", "PT", "PERF", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
